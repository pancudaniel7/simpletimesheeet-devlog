ace: nowrap; line-height: 1.5; max-width: 620px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p><b>one rule holds it together:</b> every migration is idempotent<br />verified: 3 replays, identical schema, 206 ms</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-4" data-look="classic" transform="translate(281.765625, 263)"><rect class="basic label-container" style="fill:#2d3748 !important;stroke:#4a5568 !important" x="-244.671875" y="-39" width="489.34375" height="78"/><g class="label" style="color:#fff !important" transform="translate(-214.671875, -24)"><rect/><foreignObject width="429.34375" height="48"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 620px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p><b>the duplication trap:</b> 2 repositories, 3 runners, 2 languages<br />the same files, kept in sync by hand</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-D-6" data-look="classic" transform="translate(281.765625, 383)"><rect class="basic label-container" style="fill:#742a2a !important;stroke:#9b2c2c !important" x="-273.765625" y="-39" width="547.53125" height="78"/><g class="label" style="color:#fff !important" transform="translate(-243.765625, -24)"><rect/><foreignObject width="487.53125" height="48"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 620px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p><b>failure 1, caught in production</b><br />migration 105 reported success and changed nothing for 2.5 months</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-E-8" data-look="classic" transform="translate(281.765625, 515)"><rect class="basic label-container" style="fill:#742a2a !important;stroke:#9b2c2c !important" x="-203.0078125" y="-51" width="406.015625" height="102"/><g class="label" style="color:#fff !important" transform="translate(-173.0078125, -36)"><rect/><foreignObject width="346.015625" height="72"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 620px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p><b>failure 2, caught writing this post</b><br />psql exits 0 on error, so a half-applied migration<br />is recorded as done, then skipped forever</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-F-10" data-look="classic" transform="translate(281.765625, 635)"><rect class="basic label-container" style="fill:#1a365d !important;stroke:#2c5282 !important" x="-247.484375" y="-27" width="494.96875" height="54"/><g class="label" style="color:#fff !important" transform="translate(-217.484375, -12)"><rect/><foreignObject width="434.96875" height="24"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 620px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#fff !important" class="nodeLabel"><p><b>the fix is two words:</b> ON_ERROR_STOP=1, single-transaction</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>